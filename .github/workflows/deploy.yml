name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "poc/backend/**"
      - "poc/web/**"
      - "poc/compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The containers run on the runner's own host.
    runs-on: [self-hosted, Linux, ARM64]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: docker compose -f poc/compose.yml up -d --build --remove-orphans

      - name: Check
        run: |
          for url in http://127.0.0.1:8000/health http://127.0.0.1:8080/; do
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null "$url"
            echo "OK $url"
          done
