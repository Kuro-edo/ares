# Fixed project name, so the runner's checkout directory doesn't matter.
name: ares

services:
  backend:
    build: backend
    image: ares-backend
    ports:
      # Public: the MikroTik posts locations here and the map reads them.
      - "8000:8000"
    volumes:
      - data:/data
    restart: unless-stopped

  web:
    build: web
    image: ares-web
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  data:
